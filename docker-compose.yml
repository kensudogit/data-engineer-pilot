services:
  postgres:
    image: postgres:16-alpine
    container_name: dep-postgres
    environment:
      POSTGRES_DB: data_engineer_pilot
      POSTGRES_USER: dep
      POSTGRES_PASSWORD: dep_local_password
    ports:
      - "5433:5432"
    volumes:
      - dep-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dep -d data_engineer_pilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dep-backend
    env_file:
      - .env
    ports:
      - "8030:8000"
    volumes:
      - ./backend:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dep-frontend
    environment:
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "3030:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  dep-postgres-data:
